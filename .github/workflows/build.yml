# Build LiteMonitor.app di mesin macOS GitHub, hasilnya bisa diunduh siap pakai
name: Build LiteMonitor

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal (Apple Silicon + Intel)
        run: |
          set -e
          APP=LiteMonitor.app
          ./build.sh   # bikin bundle + Info.plist
          # ganti binary dengan versi universal (Apple Silicon + Intel)
          swiftc -O -swift-version 5 -target arm64-apple-macos13.0 main.swift -o lm-arm64
          swiftc -O -swift-version 5 -target x86_64-apple-macos13.0 main.swift -o lm-x86_64
          lipo -create lm-arm64 lm-x86_64 -output "$APP/Contents/MacOS/LiteMonitor"
          codesign --force --sign - "$APP"
          ditto -c -k --keepParent "$APP" LiteMonitor.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LiteMonitor
          path: LiteMonitor.zip

      - name: Rilis (kalau push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LiteMonitor.zip
