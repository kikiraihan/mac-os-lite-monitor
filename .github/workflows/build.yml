name: Build

# Build otomatis di mesin macOS GitHub → pengguna tinggal unduh .app jadi
# (tidak perlu Xcode Command Line Tools di Mac sendiri)
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build LiteMonitor.app (universal)
        run: ARCH=universal ./scripts/build.sh

      - name: Buat installer & zip
        run: |
          ./scripts/make-installer.sh
          ditto -c -k --keepParent build/LiteMonitor.app dist/LiteMonitor.zip
          (cd dist && zip -q install-LiteMonitor.zip install-LiteMonitor.command)

      - uses: actions/upload-artifact@v4
        with:
          name: LiteMonitor
          path: |
            dist/LiteMonitor.zip
            dist/install-LiteMonitor.zip

      - name: Rilis (kalau push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LiteMonitor.zip
            dist/install-LiteMonitor.zip
